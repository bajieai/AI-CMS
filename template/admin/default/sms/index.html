{extend name="layout" /}
{block name="title"}短信服务 - AI-CMS{/block}
{block name="content"}
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="bi bi-chat-dots"></i> 短信服务</h5>
        <div>
            <a href="{:url('/admin/sms/config')}" class="btn btn-outline-success btn-sm"><i class="bi bi-gear"></i> 短信配置</a>
            <a href="{:url('/admin/sms/templates')}" class="btn btn-outline-primary btn-sm"><i class="bi bi-file-text"></i> 模板管理</a>
            <a href="{:url('/admin/sms/logs')}" class="btn btn-outline-info btn-sm"><i class="bi bi-clock-history"></i> 发送日志</a>
        </div>
    </div>
    <div class="card-body">
        <div class="row mb-4">
            <div class="col-md-3"><div class="card bg-light"><div class="card-body text-center"><h6 class="text-muted">今日发送</h6><h3>0</h3></div></div></div>
            <div class="col-md-3"><div class="card bg-light"><div class="card-body text-center"><h6 class="text-muted">本月发送</h6><h3>0</h3></div></div></div>
            <div class="col-md-3"><div class="card bg-light"><div class="card-body text-center"><h6 class="text-muted">成功率</h6><h3>100%</h3></div></div></div>
            <div class="col-md-3"><div class="card bg-light"><div class="card-body text-center"><h6 class="text-muted">已配通道</h6><h3>{:count($availableAdapters|default=[])}</h3></div></div></div>
        </div>
        <h6><i class="bi bi-send"></i> 发送测试短信</h6>
        <p class="text-muted small">点击下方按钮向指定手机号发送一条测试验证码，验证通道是否配置正确。需先在「短信配置」中填写并保存通道凭据。</p>
        <form class="row g-2 mb-3" id="smsTestForm">
            <div class="col-md-4"><input type="text" id="sms_phone" class="form-control form-control-sm" placeholder="接收测试短信的手机号"></div>
            <div class="col-md-2"><button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-send"></i> 发送测试</button></div>
        </form>
        <div id="smsTestResult" class="small"></div>
    </div>
</div>
{/block}
{block name="js"}
<script>
$('#smsTestForm').on('submit', function(e) {
    e.preventDefault();
    var phone = $('#sms_phone').val();
    if (!phone) { alert('请填写手机号'); return false; }
    $('#smsTestResult').text('发送中...');
    $.post('/admin/sms/send', {mobile: phone}, function(res) {
        if (res.code === 0) {
            $('#smsTestResult').html('<span class="text-success">发送成功，请查收手机短信</span>');
        } else {
            $('#smsTestResult').html('<span class="text-danger">发送失败：' + res.msg + '</span>');
        }
    });
    return false;
});
</script>
{/block}
