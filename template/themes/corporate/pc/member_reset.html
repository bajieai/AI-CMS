{extend name="layout" /}

{block name="title"}重置密码{/block}

{block name="content"}
<div style="min-height:calc(100vh - 200px);display:flex;align-items:center;justify-content:center;padding:3rem 1rem;background:var(--i8j-bg-secondary,#f8fafc);">
    <div style="width:100%;max-width:460px;background:var(--i8j-bg,#fff);border-radius:16px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.08);">
        <div style="background:linear-gradient(135deg, var(--i8j-text,#1e293b) 0%, var(--i8j-text,#334155) 100%);padding:2.5rem 2rem;text-align:center;position:relative;overflow:hidden;">
            <div style="position:absolute;top:-30px;right:-30px;width:100px;height:100px;background:rgba(59,130,246,.15);border-radius:50%;"></div>
            <div style="position:relative;z-index:1;">
                <div style="width:64px;height:64px;margin:0 auto .75rem;background:rgba(255,255,255,.12);border-radius:16px;display:flex;align-items:center;justify-content:center;">
                    <i class="bi bi-shield-lock" style="font-size:1.65rem;color:#fff;"></i>
                </div>
                <h4 class="text-white mb-0 fw-bold" style="font-size:1.25rem;">重置密码</h4>
                <p class="mb-0 opacity-75" style="color:rgba(255,255,255,.7);font-size:.88rem;">请设置您的新密码</p>
            </div>
        </div>
        <div style="padding:2.25rem 2.5rem 2.5rem;">
            <form id="resetForm">
                <input type="hidden" name="token" value="{$token}">
                <div class="mb-3">
                    <label class="form-label fw-semibold small text-uppercase" style="color:var(--i8j-text-secondary,#64748b);letter-spacing:.04em;">新密码</label>
                    <input type="password" name="password" class="form-control form-control-lg" required placeholder="至少6位" minlength="6" style="border-radius:10px;border-color:var(--i8j-border,#e2e8f0);font-size:.96rem;padding:.7rem 1rem;">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold small text-uppercase" style="color:var(--i8j-text-secondary,#64748b);letter-spacing:.04em;">确认密码</label>
                    <input type="password" name="confirm_password" class="form-control form-control-lg" required placeholder="再次输入新密码" minlength="6" style="border-radius:10px;border-color:var(--i8j-border,#e2e8f0);font-size:.96rem;padding:.7rem 1rem;">
                </div>
                <button type="submit" class="btn btn-lg w-100" id="submitBtn" style="background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border-radius:10px;font-weight:700;font-size:1rem;border:none;padding:.78rem;box-shadow:0 4px 18px rgba(59,130,246,.35);">
                    重置密码
                </button>
            </form>
        </div>
    </div>
</div>
{/block}

{block name="js"}
<script>
$('#resetForm').on('submit', function(e) {
    e.preventDefault();
    var btn = $('#submitBtn');
    btn.prop('disabled', true).text('重置中...');
    $.post('/member/password/reset', $(this).serialize(), function(res) {
        btn.prop('disabled', false).text('重置密码');
        if (res.success) {
            alert(res.msg);
            location.href = '/member/login';
        } else {
            alert(res.msg);
        }
    }).fail(function() {
        btn.prop('disabled', false).text('重置密码');
        alert('网络错误，请稍后重试');
    });
});
</script>
{/block}
