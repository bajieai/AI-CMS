{extend name="layout" /}

{block name="title"}会员注册{/block}

{block name="content"}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h4 class="card-title text-center mb-4">会员注册</h4>
                    <form id="registerForm" method="post">
                        <div class="mb-3">
                            <label class="form-label">用户名</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">邮箱</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">密码</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">昵称</label>
                            <input type="text" name="nickname" class="form-control">
                        </div>
                        <!-- V2.9.9 注册验证码 -->
                        <div class="mb-3">
                            <label class="form-label">验证码</label>
                            <div class="d-flex gap-2">
                                <input type="text" name="captcha_answer" class="form-control" style="flex:1;" required placeholder="请输入验证码" autocomplete="off">
                                <input type="hidden" name="captcha_key" id="captchaKey">
                                <div id="captchaBox" class="d-flex align-items-center justify-content-center" style="width:120px;min-height:38px;background:#f0fdf4;border:1px solid #ddd;border-radius:6px;cursor:pointer;overflow:hidden;">
                                    <span class="text-muted small">加载中...</span>
                                </div>
                            </div>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">注册</button>
                        </div>
                    </form>
                    <div class="text-center mt-3">
                        <a href="/member/login" class="text-decoration-none small">已有账号？立即登录</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{/block}

{block name="js"}
<script>
$(function() {
    function loadCaptcha() {
        $.get('/member/captcha', function(res) {
            if (res.success && res.data) {
                var $box = $('#captchaBox');
                $box.empty();
                if (res.data.mode === 'image' && res.data.image) {
                    $box.html('<img src="' + res.data.image + '" style="max-width:100%;height:auto;display:block;margin:0 auto;" alt="验证码">');
                } else {
                    $box.html('<span class="fw-bold" style="font-size:1rem;">' + (res.data.text || '验证码') + '</span>');
                }
                $('#captchaKey').val(res.data.key);
            }
        });
    }
    loadCaptcha();
    $('#captchaBox').on('click', function() { loadCaptcha(); });

    $('#registerForm').on('submit', function(e) {
        e.preventDefault();
        $.post('/member/register', $(this).serialize(), function(res) {
            if (res.success) {
                alert('注册成功，请登录');
                location.href = '/member/login';
            } else {
                alert(res.msg);
                loadCaptcha();
            }
        });
    });
});
</script>
{/block}
