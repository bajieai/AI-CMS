{extend name="layout" /}

{block name="title"}找回密码{/block}

{block name="content"}
<div class="m-content">
    <div class="m-card" style="padding:24px 18px;margin-top:10px;">
        <h4 class="text-center mb-3" style="font-size:18px;font-weight:700;">找回密码</h4>
        <p class="text-center text-muted" style="font-size:13px;margin-bottom:16px;">输入注册邮箱，发送重置链接</p>
        <form id="forgotForm">
            <div class="m-form-group">
                <label style="font-size:13px;font-weight:550;color:#555;display:block;margin-bottom:4px;">注册邮箱</label>
                <input type="email" name="email" class="m-form-control" placeholder="请输入注册邮箱" required>
            </div>
            <button type="submit" class="m-btn m-btn-primary" id="submitBtn" style="margin-top:6px;">发送重置链接</button>
        </form>
        <div class="text-center mt-3"><a href="/member/login" style="font-size:13.5px;color:#0d6efd;text-decoration:none;">返回登录</a></div>
    </div>
</div>
{/block}
{block name="js"}
<script>$('#forgotForm').on('submit',function(e){e.preventDefault();var b=$('#submitBtn');b.prop('disabled',!0).text('发送中...');$.post('/member/password/forgot',$(this).serialize(),function(r){b.prop('disabled',!1).text('发送重置链接');if(r.success){alert(r.msg+'，请检查您的邮箱');}else{alert(r.msg);}}).fail(function(){b.prop('disabled',!1).text('发送重置链接');alert('网络错误');});});</script>
{/block}
